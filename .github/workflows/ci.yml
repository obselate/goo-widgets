name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Read package version
        id: version
        run: |
          version="$(dotnet msbuild src/Goo.Widgets/Goo.Widgets.gsproj -getProperty:Version -nologo)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: bash scripts/verify.sh
      - name: Install headless Wayland and the Vulkan software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core libdecor-0-0 libfontconfig1 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libxkbcommon0 mesa-vulkan-drivers weston
      - name: Native capture contracts
        env:
          DOTNET_DbgEnableMiniDump: 1
          DOTNET_DbgMiniDumpType: 2
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/artifacts/native-dumps/%e.%p.dmp
          DOTNET_EnableCrashReport: 1
        run: |
          ulimit -c unlimited
          mkdir -p artifacts/native-dumps
          for attempt in $(seq 1 20); do
            printf 'ComboBox teardown probe %s\n' "$attempt"
            env GOO_WIDGETS_COMBOBOX=1 SDL_VIDEODRIVER=wayland scripts/with-headless-wayland.sh \
              dotnet tests/Goo.Widgets.Consumer/bin/Release/net10.0/Goo.Widgets.Consumer.dll
          done
      - name: Upload native crash evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-crash-evidence
          path: artifacts/native-dumps/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Goo.Widgets
          path: artifacts/packages/*
          if-no-files-found: error

  release:
    if: github.repository == 'obselate/goo-widgets' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      WIDGETS_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Validate release tag
        run: |
          test "$GITHUB_REF_NAME" = "v$WIDGETS_VERSION"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Goo.Widgets
          path: artifacts/packages
      - name: Verify package checksum
        working-directory: artifacts/packages
        run: sha256sum --check SHA256SUMS
      - name: Require NuGet identity
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"
      - name: Get temporary NuGet API key
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for package in Goo.Widgets Goo.Widgets.Markdown; do
            dotnet nuget push "artifacts/packages/$package.$WIDGETS_VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --no-symbols \
              --skip-duplicate
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$WIDGETS_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              "artifacts/packages/Goo.Widgets.$WIDGETS_VERSION.nupkg" \
              "artifacts/packages/Goo.Widgets.Markdown.$WIDGETS_VERSION.nupkg" \
              artifacts/packages/SHA256SUMS \
              "${flags[@]}" \
              --verify-tag \
              --title "Goo Widgets $WIDGETS_VERSION" \
              --notes-file CHANGELOG.md
          fi
