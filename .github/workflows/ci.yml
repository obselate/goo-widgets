name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  WIDGETS_APT_PACKAGES: >-
    fonts-dejavu-core libdecor-0-0 libfontconfig1 libwayland-client0 libwayland-cursor0
    libwayland-egl1 libxkbcommon0 mesa-vulkan-drivers weston
    at-spi2-core build-essential dbus-daemon kwin-common kwin-wayland libdbus-1-dev libei-dev pkg-config xwayland

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Cache NuGet, Gsharp compiler and native payloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.gsproj', '**/packages.lock.json', 'Directory.Build.props', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Read package version
        id: version
        run: |
          version="$(dotnet msbuild src/Goo.Widgets/Goo.Widgets.gsproj -getProperty:Version -nologo)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: bash scripts/verify.sh build
      - name: Archive native test payload
        run: |
          tar -cf artifacts/native-tests.tar \
            tests/Goo.Widgets.Consumer/bin/Release/net10.0 \
            tools/Goo.Widgets.NativeTests/bin/Release/net10.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-tests
          path: artifacts/native-tests.tar
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Goo.Widgets
          path: artifacts/packages/*
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Cache NuGet, Gsharp compiler and native payloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.gsproj', '**/packages.lock.json', 'Directory.Build.props', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-tests
          path: artifacts
      - run: tar -xf artifacts/native-tests.tar
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Goo.Widgets
          path: artifacts/packages
      - run: bash scripts/verify.sh package

  native:
    name: Native capture contracts (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: theme
            suites: THEME
          - group: virtualization
            suites: VIRTUAL DATA_GRID TREE LISTS SEARCHLIST
          - group: overlays
            suites: COMBOBOX CALENDAR OVERLAYS POPUPS
          - group: composition
            suites: PATH_ACTIONS TIME_AXIS GRID_CHARTS COMPOSITES DISCLOSURE WINDOW
          - group: input
            suites: FIELDS MODAL_CLIPBOARD TEXT_SURFACES MARKDOWN TOUCH_EDITING GRAPH_TOUCH TOKENS
          - group: chrome
            suites: CHROME CHOICES FEEDBACK_IDENTITY NAVIGATION LAYOUT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-tests
          path: artifacts
      - run: tar -xf artifacts/native-tests.tar
      - name: Update Linux package lists
        id: linux-apt
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/goo-apt-archives"
          sudo apt-get --print-uris --yes --no-install-recommends install $WIDGETS_APT_PACKAGES sway \
            > "$RUNNER_TEMP/goo-apt-packages"
          read -r key _ < <(sha256sum "$RUNNER_TEMP/goo-apt-packages")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore Linux package archives
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/goo-apt-archives/*.deb
          key: apt-linux-x64-${{ steps.linux-apt.outputs.key }}
      - name: Install headless Wayland and the Vulkan software driver
        run: |
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$RUNNER_TEMP/goo-apt-archives" \
            $WIDGETS_APT_PACKAGES
      - name: Install Sway clipboard seat
        run: |
          /usr/bin/time -f 'Sway clipboard seat installation: %e seconds' \
            sudo apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives="$RUNNER_TEMP/goo-apt-archives" sway
      - name: Save Linux package archives
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/goo-apt-archives/*.deb
          key: apt-linux-x64-${{ steps.linux-apt.outputs.key }}
      - name: Native capture contracts
        env:
          DOTNET_DbgEnableMiniDump: 1
          DOTNET_DbgMiniDumpType: 2
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/artifacts/native-dumps/%e.%p.dmp
          NATIVE_SUITES: ${{ matrix.suites }}
          DOTNET_EnableCrashReport: 1
        run: |
          ulimit -c unlimited
          mkdir -p artifacts/native-dumps
          bash scripts/verify-native.sh $NATIVE_SUITES
      - name: Upload native crash evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-crash-evidence-${{ matrix.group }}
          path: |
            artifacts/native-dumps/*
            artifacts/native-test/*.log
          if-no-files-found: ignore

  verify:
    if: always()
    needs: [build, package, native]
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - run: |
          test '${{ needs.build.result }}' = success
          test '${{ needs.package.result }}' = success
          test '${{ needs.native.result }}' = success

  release:
    if: github.repository == 'obselate/goo-widgets' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      WIDGETS_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Validate release tag
        run: |
          test "$GITHUB_REF_NAME" = "v$WIDGETS_VERSION"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Goo.Widgets
          path: artifacts/packages
      - name: Verify package checksum
        working-directory: artifacts/packages
        run: sha256sum --check SHA256SUMS
      - name: Require NuGet identity
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"
      - name: Get temporary NuGet API key
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org and GitHub Packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for package in Goo.Widgets Goo.Widgets.Markdown; do
            dotnet nuget push "artifacts/packages/$package.$WIDGETS_VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --no-symbols \
              --skip-duplicate
            dotnet nuget push "artifacts/packages/$package.$WIDGETS_VERSION.nupkg" \
              --api-key "${{ github.token }}" \
              --source https://nuget.pkg.github.com/obselate/index.json \
              --no-symbols \
              --skip-duplicate
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$WIDGETS_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              "artifacts/packages/Goo.Widgets.$WIDGETS_VERSION.nupkg" \
              "artifacts/packages/Goo.Widgets.Markdown.$WIDGETS_VERSION.nupkg" \
              artifacts/packages/SHA256SUMS \
              "${flags[@]}" \
              --verify-tag \
              --title "Goo Widgets $WIDGETS_VERSION" \
              --notes-file CHANGELOG.md
          fi
